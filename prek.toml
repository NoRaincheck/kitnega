[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.15.13"
hooks = [{ id = "ruff-check", args = ["--fix"] }, { id = "ruff-format" }]

[[repos]]
repo = "local"
hooks = [
  { id = "deno-fmt", name = "deno fmt", entry = "deno fmt", language = "system", types = [
    "markdown",
  ] },
]
