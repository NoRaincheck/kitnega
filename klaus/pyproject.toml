[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "klaus"
version = "0.1.0"
description = "Minimal Slack clone with Bottle + htmx"
requires-python = ">=3.14"
dependencies = ["lib"]

[project.scripts]
klaus = "klaus.__main__:main"

[tool.setuptools.packages.find]
include = ["klaus*"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I001"]
