[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "kenneth"
version = "0.1.0"
description = "Kneser-Ney language model with stdlib-only implementation and PyTorch/ONNX export"
requires-python = ">=3.14"
dependencies = ["lib"]

[project.scripts]
kenneth = "kenneth.__main__:main"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.13",
    "ty>=0.0.37",
]

[tool.setuptools.packages.find]
include = ["kenneth*"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I001"]
