<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
      pre#source {
        padding: 12px;
        background-color: lightgrey;
      }

      button#run-button:hover {
        background-color: grey;
      }

      pre#output-wrapper {
        padding: 12px;
        background-color: lightgrey;
      }

      span.error-line {
        color: #ec5424;
      }
    </style>

    <title>Try Online</title>
  </head>

  <body id="tryonline-body">
    <main>
      <pre id="source"></pre>
      <button id="run-button">Run</button>
      <pre id="output-wrapper"><div id="code-output">...</div></pre>
    </main>

    <script>
      var Module = {
        onRuntimeInitialized: function () {
          Module.ccall("py_initialize", null, [], []);
          console.log("py_initialize() called");
        },
        print: function (text) {
          code_output.innerText += text + "\n";
        },
        onabort: function (what) {
          code_output.innerText += "Aborted: " + what + "\n";
          Module.ccall("py_finalize", null, [], []);
          console.log("py_finalize() called");
        },
      };
    </script>
    <script src="lib/pocketpy.js"></script>
    <script>
      var source_code = [
        "# A recursive fibonacci function.",
        "def fib(n):",
        "  if n < 2:",
        "    return n",
        "  return fib(n-1) + fib(n-2)",
        "",
        "# Prints all fibonacci from 0 to 10 exclusive.",
        "for i in range(10):",
        '  print(f"fib({i}) = {fib(i)}")',
      ].join("\n");

      document.querySelector("#source").textContent = source_code;
      var code_output = document.querySelector("#code-output");
      var run_button = document.querySelector("#run-button");

      window.onload = function () {
        run_button.onclick = function () {
          code_output.innerText = "";
          var ok = Module.ccall(
            "py_exec",
            "boolean",
            ["string", "string", "number", "number"],
            [source_code, "main.py", 0, 0],
          );
          console.log("py_exec() called");
          if (!ok) {
            Module.ccall("py_printexc", null, [], []);
            Module.ccall("py_clearexc", null, ["number"], [0]);
          }
        };
      };
    </script>
  </body>
</html>
