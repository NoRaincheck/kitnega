[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "lib"
version = "0.1.0"
description = "Shared utilities for kitnega workspace members"
requires-python = ">=3.14"
dependencies = []

[project.scripts]
llm = "lib.llm:main"

[tool.setuptools.packages.find]
include = ["lib*"]

[tool.ruff]
line-length = 120
extend-exclude = ["lib/bottle.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I001"]
