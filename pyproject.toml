[project]
name = "kitnega"
version = "0.1.0"
description = "A minimal agentic coding harness using only Python stdlib"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[project.scripts]
kitnega = "kitnega.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.13",
    "ty>=0.0.37",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
